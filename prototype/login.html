<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamFlow | Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <p>TeamFlow</p>
    </header>
    
    <main>
        <h1>Sign in</h1>
        <p>Welcome back! Sign in to your TeamFlow workspace.</p>

        <form method="post">
            <div>
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"  aria-invalid="true" aria-describedby="emailError" required>
                <p id="emailError" class="error">Please enter a valid email address.</p>
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit">Sign In</button>
        </form>
    </main>
    
    <footer>
        <p>TeamFlow login management prototype</p>
    </footer>
    
    
</body>
</html>
